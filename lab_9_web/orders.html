<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мои заказы — Food Construct</title>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="styles/styles_2.css">
</head>
<body>
    <header class="header">
        <h1 class="header__title">Food Construct</h1>
        <nav class="nav">
            <ul class="nav__list">
                <li><a href="index.html" class="nav__link">О нас</a></li>
                <li><a href="lanch.html" class="nav__link">Собрать ланч</a></li>
                <li><a href="order.html" class="nav__link">Оформить заказ</a></li>
                <li><a href="orders.html" class="nav__link active">Мои заказы</a></li>
                <li><a href="#" class="nav__link">Контакты</a></li>
            </ul>
        </nav>
    </header>

    <main class="main">
        <section class="section">
            <h2 class="section__title">Мои заказы</h2>
            <div id="orders-container" class="orders-container">
                <!-- Заказы будут загружены динамически -->
                <div class="loading">Загрузка заказов...</div>
            </div>
        </section>
    </main>

    <!-- Модальное окно просмотра деталей заказа -->
    <div id="order-details-modal" class="modal">
        <div class="modal-content">
            <span class="modal-close">&times;</span>
            <h3 id="modal-title">Детали заказа</h3>
            <div id="modal-body"></div>
            <div class="modal-actions">
                <button id="modal-ok" class="btn btn-primary">Ок</button>
            </div>
        </div>
    </div>

    <!-- Модальное окно редактирования заказа -->
    <div id="edit-order-modal" class="modal">
        <div class="modal-content">
            <span class="modal-close">&times;</span>
            <h3>Редактирование заказа</h3>
            <form id="edit-order-form" class="order-form__content">
                <div class="form-group">
                    <label for="edit-full_name" class="form-label">Имя</label>
                    <input type="text" name="full_name" id="edit-full_name" class="form-input" required>
                </div>
                <div class="form-group">
                    <label for="edit-email" class="form-label">Email</label>
                    <input type="email" name="email" id="edit-email" class="form-input" required>
                </div>
                <div class="form-group">
                    <label for="edit-phone" class="form-label">Телефон</label>
                    <input type="tel" name="phone" id="edit-phone" class="form-input" required>
                </div>
                <div class="form-group">
                    <label for="edit-delivery_address" class="form-label">Адрес доставки</label>
                    <input type="text" name="delivery_address" id="edit-delivery_address" class="form-input" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Время доставки:</label>
                    <div class="form-option">
                        <input type="radio" name="delivery_type" id="edit-asap" class="form-radio" value="now" required>
                        <label for="edit-asap" class="form-label">Как можно скорее</label>
                    </div>
                    <div class="form-option">
                        <input type="radio" name="delivery_type" id="edit-specific-time" class="form-radio" value="by_time" required>
                        <label for="edit-specific-time" class="form-label">К указанному времени</label>
                        <input type="time" name="delivery_time" id="edit-delivery_time" class="form-input time-input" min="07:00" max="23:00" step="300">
                    </div>
                </div>
                <div class="form-group">
                    <label for="edit-comment" class="form-label">Комментарий</label>
                    <textarea name="comment" id="edit-comment" class="form-textarea" rows="3"></textarea>
                </div>
                <input type="hidden" id="edit-order-id">
                <div class="modal-actions">
                    <button type="submit" class="btn btn-primary">Сохранить</button>
                    <button type="button" id="edit-cancel" class="btn btn-secondary">Отмена</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Модальное окно подтверждения удаления -->
    <div id="delete-order-modal" class="modal">
        <div class="modal-content">
            <span class="modal-close">&times;</span>
            <h3>Подтверждение удаления</h3>
            <p>Вы уверены, что хотите удалить этот заказ?</p>
            <input type="hidden" id="delete-order-id">
            <div class="modal-actions">
                <button id="delete-confirm" class="btn btn-danger">Да, удалить</button>
                <button id="delete-cancel" class="btn btn-secondary">Отмена</button>
            </div>
        </div>
    </div>

    <footer class="footer">
        <p>Позвонить нам: +7-000-000-00-00</p>
    </footer>
    
    <script src="script.js"></script>
    <script src="storage.js"></script>
    <script src="orders.js"></script>
    <!-- Добавьте перед закрывающим тегом </body> -->
    <script>
    // Проверка доступности функций
    console.log('Проверка доступности функций:');
    console.log('loadDishes:', typeof loadDishes);
    console.log('dish_arr глобально:', typeof window.dish_arr !== 'undefined' ? 'есть' : 'нет');
</script>
</body>
</html>
